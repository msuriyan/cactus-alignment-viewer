<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cactus Alignment Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: app bar / [sidebar | navigation + figure sheet] / status line. The figure sheet stays paper-white for WYSIWYG export. */
:root{
  --bg:#eef0f4; --panel:#ffffff; --panel2:#f6f7fa; --ink:#1b2130; --muted:#5b6476; --line:#d7dbe4;
  --accent:#34489e; --accent-ink:#ffffff; --accent-soft:rgba(52,72,158,.10); --warn:#a4531c; --ok:#2c7a4b;
  --sans:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11141b; --panel:#191d26; --panel2:#1f2430; --ink:#e4e7ee; --muted:#98a0b3; --line:#2c3242;
  --accent:#8a9cff; --accent-ink:#0f1320; --accent-soft:rgba(138,156,255,.14); --warn:#e59a62; --ok:#6fcf97; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141b; --panel:#191d26; --panel2:#1f2430; --ink:#e4e7ee; --muted:#98a0b3; --line:#2c3242;
  --accent:#8a9cff; --accent-ink:#0f1320; --accent-soft:rgba(138,156,255,.14); --warn:#e59a62; --ok:#6fcf97; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.45 var(--sans);display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.appbar{display:flex;align-items:center;gap:14px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-weight:600;letter-spacing:.01em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand svg{flex:none}
.brand small{font-weight:400;color:var(--muted);font-size:12px}
.appbar .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap;line-height:1.3}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.ib:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:2px 8px;font-size:12px}
.ib{border:0;background:transparent;cursor:pointer;padding:2px 5px;border-radius:4px;color:var(--muted);line-height:1}
.ib:hover{background:var(--accent-soft);color:var(--ink)}
.main{display:grid;grid-template-columns:340px 1fr;min-height:0}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:transparent;padding:9px 4px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;font-weight:500}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pane{overflow:auto;padding:12px 14px 40px;flex:1;min-height:0}
.pane h3{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:16px 0 6px;font-weight:600}
.pane h3:first-child{margin-top:2px}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:14px;text-align:center;color:var(--muted);background:var(--panel2)}
.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.drop b{color:var(--ink);font-weight:500}
.drop .row{justify-content:center;margin-top:8px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.field{display:grid;grid-template-columns:118px 1fr;gap:6px;align-items:center;margin:5px 0}
.field label{color:var(--muted);font-size:12px}
.field input[type=text],.field input[type=number],.field select,.field textarea{width:100%;min-width:0;padding:3px 6px;border:1px solid var(--line);border-radius:5px;background:var(--panel)}
.field input[type=color]{width:36px;height:24px;padding:0;border:1px solid var(--line);border-radius:4px;background:none}
input[type=checkbox]{accent-color:var(--accent)}
.track{border:1px solid var(--line);border-radius:7px;margin:6px 0;background:var(--panel)}
.track .hd{display:flex;align-items:center;gap:6px;padding:5px 6px}
.track .hd .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kind{font:500 10px var(--mono);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--panel2);border-radius:4px;padding:1px 5px}
.track .bd{padding:4px 10px 8px;border-top:1px solid var(--line)}
.sw{width:12px;height:12px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.15)}
.sptable{width:100%;border-collapse:collapse}
.sptable td{padding:2px 3px;vertical-align:middle}
.sptable input[type=text]{width:100%;min-width:0;padding:2px 5px;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
.sptable tr.ref td{background:var(--accent-soft)}
.note{color:var(--muted);font-size:12px;margin:6px 0}
.note.warn{color:var(--warn)}
.viewer{display:flex;flex-direction:column;min-width:0;min-height:0}
.nav{display:flex;gap:6px;align-items:center;padding:7px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.nav input#locus{width:250px;max-width:100%;font-family:var(--mono);font-size:12.5px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.nav select{padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);max-width:180px}
.nav select#zoomPreset{max-width:96px}
.nav .btn{padding:5px 9px}
.nav .grp{display:flex;gap:2px}
.nav .w{font:12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.focusbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 12px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:12.5px}
.focusbar .fb-l{font-weight:600}
.focusbar select,.focusbar input{padding:2px 6px;border:1px solid var(--line);border-radius:5px;background:var(--panel)}
.focusbar .grp{display:flex;gap:2px}
.focusbar.on{background:var(--accent-soft)}
.ptable{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:12.5px}
.ptable th{position:sticky;top:0;background:var(--panel);text-align:left;font-weight:600;padding:5px 8px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap}
.ptable th[data-num]{text-align:right}
.ptable td{padding:3px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.ptable td.n{text-align:right;font-family:var(--mono);font-size:12px}
.ptable tr.go:hover td{background:var(--accent-soft);cursor:pointer}
.bar{display:inline-block;height:8px;border-radius:2px;background:var(--accent);vertical-align:middle;margin-left:6px;opacity:.75}
.stage{flex:1;overflow:auto;padding:14px;min-height:0;position:relative}
.sheet{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px rgba(0,0,0,.06);border-radius:3px;position:relative;width:100%}
.sheet canvas{display:block;cursor:grab;touch-action:none}
.sheet canvas.dragging{cursor:grabbing}
.sheet canvas.selecting{cursor:col-resize}
.sheet canvas.drawing{cursor:crosshair}
.empty{padding:48px 28px;color:#4a5263;max-width:720px}
.empty h2{margin:0 0 8px;font-size:20px;color:#1b2130;text-wrap:balance}
.empty ol{padding-left:18px}
.empty code{font-family:var(--mono);font-size:12px;background:#f1f3f7;padding:1px 4px;border-radius:3px}
.status{display:flex;gap:16px;padding:4px 14px;background:var(--panel);border-top:1px solid var(--line);font:12px var(--mono);color:var(--muted);min-height:26px;align-items:center}
.status .msg{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status .busy::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:6px;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.status .busy::before{animation:none}}
.tip{position:fixed;pointer-events:none;background:#1b2130;color:#f2f4f8;font:12px/1.4 var(--mono);padding:6px 8px;border-radius:5px;z-index:50;max-width:420px;white-space:pre;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.pop{position:fixed;z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:6px;min-width:200px}
.pop .mi{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 10px;border-radius:5px;cursor:pointer}
.pop .mi:hover{background:var(--accent-soft)}
.pop .sep{height:1px;background:var(--line);margin:4px 0}
.pop .ttl{font-size:11px;color:var(--muted);padding:4px 10px;font-family:var(--mono)}
.pop.form{padding:12px;width:300px}
.modal-bg{position:fixed;inset:0;background:rgba(15,18,28,.45);z-index:70;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--panel);border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.35);width:min(1200px,100%);max-height:100%;display:flex;flex-direction:column;min-height:0}
.modal .mh{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.modal .mh h2{font-size:15px;margin:0;flex:1;min-width:160px}
.modal .mb{overflow:auto;padding:12px 14px;min-height:0;flex:1}
.alnscroll{overflow:auto;height:min(68vh,900px);background:#fff;border:1px solid var(--line);border-radius:4px;position:relative}
.alnscroll canvas{position:sticky;top:0;left:0;display:block}
.toast{position:fixed;right:16px;bottom:40px;z-index:90;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:7px;max-width:440px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.kbd{font:11px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--muted)}
.hide-sm{}
@media (max-width:820px){
  .main{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(340px,92vw);z-index:40;transform:translateX(-102%);transition:transform .2s;box-shadow:0 0 30px rgba(0,0,0,.3)}
  body.side-open .side{transform:none}
  .hide-sm{display:none}
}
@media (min-width:821px){#sideToggle{display:none}}
</style>
</head>
<body>
<header class="appbar">
  <button class="ib" id="sideToggle" aria-label="Show panel">☰</button>
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M3 4h5M5.5 4v7M5.5 11h4M5.5 4v0M9.5 11V7.5h3M9.5 11v3.5h3M3 4v14h5" stroke="currentColor" stroke-width="1.6" fill="none"/><rect x="14" y="6" width="6" height="3" fill="#34489e"/><rect x="14" y="13" width="6" height="3" fill="#6b5ca5"/><rect x="9" y="17" width="11" height="2" fill="#9aa3c7"/></svg>
    Cactus Alignment Viewer <small class="hide-sm">bigMaf · tree · ATAC · GFF</small>
  </div>
  <div class="sp"></div>
  <button class="btn" id="btnOpen">Open files…</button>
  <button class="btn" id="btnAln" title="View the bases of the selected region or current view">View alignment</button>
  <button class="btn primary" id="btnExport">Export…</button>
  <button class="btn" id="btnGetApp" title="Save this tool as one HTML file to run offline on your computer" hidden>Download app</button>
  <button class="ib" id="btnHelp" title="Help" aria-label="Help">?</button>
  <input type="file" id="fileInput" multiple hidden>
  <input type="file" id="sessionInput" accept=".json" hidden>
</header>
<div class="main">
  <aside class="side">
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="tracks" aria-selected="true">Tracks</button>
      <button role="tab" data-tab="species" aria-selected="false">Species &amp; tree</button>
      <button role="tab" data-tab="style" aria-selected="false">Figure style</button>
    </div>
    <div class="pane" id="pane-tracks"></div>
    <div class="pane" id="pane-species" hidden></div>
    <div class="pane" id="pane-style" hidden></div>
  </aside>
  <section class="viewer">
    <div class="nav">
      <select id="chromSel" aria-label="Chromosome"></select>
      <input id="locus" aria-label="Location or gene name" placeholder="chrom:start..end or gene name" spellcheck="false">
      <button class="btn" id="btnGo">Go</button>
      <div class="grp">
        <button class="btn" id="btnLeft" title="Pan left (←)">◀</button>
        <button class="btn" id="btnRight" title="Pan right (→)">▶</button>
      </div>
      <div class="grp">
        <button class="btn" id="btnOut" title="Zoom out (−)">−</button>
        <button class="btn" id="btnIn" title="Zoom in (+)">+</button>
        <button class="btn" id="btnAll" title="Zoom out to the whole chromosome">⤢</button>
      </div>
      <select id="zoomPreset" aria-label="Zoom to width" title="Zoom to a fixed width">
        <option value="">Zoom…</option><option value="100">100 bp</option><option value="500">500 bp</option><option value="1000">1 kb</option><option value="5000">5 kb</option><option value="10000">10 kb</option><option value="50000">50 kb</option><option value="100000">100 kb</option><option value="250000">250 kb</option><option value="500000">500 kb</option><option value="1000000">1 Mb</option><option value="2000000">2 Mb</option><option value="all">Whole chromosome</option>
      </select>
      <div class="grp">
        <button class="btn" id="btnBack" title="Previous view (undo zoom/pan)" disabled>↶</button>
        <button class="btn" id="btnFwd" title="Next view" disabled>↷</button>
      </div>
      <span class="w" id="viewWidth"></span>
      <span style="flex:1"></span>
      <button class="btn" id="btnAddBox" title="Draw a box over part of the figure (drag on the figure)">+ Box</button>
      <button class="btn" id="btnAddText" title="Add a text label you can drag anywhere on the figure">+ Text</button>
      <button class="btn" id="btnSaveView" title="Save the current view as an image">Save view ▾</button>
    </div>
    <div class="focusbar" id="focusBar" hidden>
      <span class="fb-l">Focus alignment on</span>
      <select id="fbTrack" aria-label="Regions to focus on"></select>
      <label id="fbPadL">± <input type="number" id="fbPad" min="0" max="1000000" step="50" value="0" style="width:72px"> bp</label>
      <label id="fbModeL">outside: <select id="fbMode"><option value="hide">hide</option><option value="dim">fade</option></select></label>
      <span class="grp" id="fbNav"><button class="btn small" id="fbPrev" title="Previous region">◂ Prev</button><button class="btn small" id="fbNext" title="Next region">Next ▸</button></span>
      <button class="btn small" id="fbAnalyse" title="Conservation statistics, exports and a multi-peak figure">Peak analysis…</button>
    </div>
    <div class="stage" id="stage">
      <div class="sheet" id="sheet">
        <canvas id="cv" hidden></canvas>
        <div class="empty" id="empty"></div>
      </div>
    </div>
  </section>
</div>
<footer class="status"><span class="msg" id="statusMsg">Ready</span><span id="statusPos"></span></footer>
<div class="tip" id="tip" hidden></div>

<script>
"use strict";
/* =====================================================================
   1. DEFLATE / ZLIB / GZIP  (pure JS, so the file works fully offline)
   ===================================================================== */
const Inflate=(()=>{
  function Tree(){this.table=new Uint16Array(16);this.trans=new Uint16Array(288);}
  const sltree=new Tree(),sdtree=new Tree(),codeTree=new Tree();
  const lenBits=new Uint8Array(30),lenBase=new Uint16Array(30),distBits=new Uint8Array(30),distBase=new Uint16Array(30);
  const clcidx=new Uint8Array([16,17,18,0,8,7,9,6,10,5,11,4,12,3,13,2,14,1,15]);
  function bb(bits,base,delta,first){for(let i=0;i<delta;i++)bits[i]=0;for(let i=0;i<30-delta;i++)bits[i+delta]=(i/delta)|0;for(let sum=first,i=0;i<30;i++){base[i]=sum;sum+=1<<bits[i];}}
  bb(lenBits,lenBase,4,3);bb(distBits,distBase,2,1);lenBits[28]=0;lenBase[28]=258;
  (function(){const lt=sltree,dt=sdtree;for(let i=0;i<7;i++)lt.table[i]=0;lt.table[7]=24;lt.table[8]=152;lt.table[9]=112;
    for(let i=0;i<24;i++)lt.trans[i]=256+i;for(let i=0;i<144;i++)lt.trans[24+i]=i;for(let i=0;i<8;i++)lt.trans[168+i]=280+i;for(let i=0;i<112;i++)lt.trans[176+i]=144+i;
    for(let i=0;i<5;i++)dt.table[i]=0;dt.table[5]=32;for(let i=0;i<32;i++)dt.trans[i]=i;})();
  const offs=new Uint16Array(16);
  function build(t,lengths,off,num){t.table.fill(0);for(let i=0;i<num;i++)t.table[lengths[off+i]]++;t.table[0]=0;
    for(let sum=0,i=0;i<16;i++){offs[i]=sum;sum+=t.table[i];}for(let i=0;i<num;i++){if(lengths[off+i])t.trans[offs[lengths[off+i]]++]=i;}}
  function D(src,pos,hint){this.s=src;this.i=pos;this.tag=0;this.bc=0;this.out=new Uint8Array(Math.max(4096,hint||src.length*4));this.o=0;this.lt=new Tree();this.dt=new Tree();}
  function getbit(d){if(!d.bc--){d.tag=d.s[d.i++]|0;d.bc=7;}const b=d.tag&1;d.tag>>>=1;return b;}
  function rb(d,num,base){if(!num)return base;while(d.bc<24){d.tag|=(d.s[d.i++]|0)<<d.bc;d.bc+=8;}const v=d.tag&(0xffff>>>(16-num));d.tag>>>=num;d.bc-=num;return v+base;}
  function dsym(d,t){while(d.bc<24){d.tag|=(d.s[d.i++]|0)<<d.bc;d.bc+=8;}let sum=0,cur=0,len=0,tag=d.tag;
    do{cur=2*cur+(tag&1);tag>>>=1;++len;sum+=t.table[len];cur-=t.table[len];}while(cur>=0&&len<16);d.tag=tag;d.bc-=len;return t.trans[sum+cur];}
  function trees(d,lt,dt){const hlit=rb(d,5,257),hdist=rb(d,5,1),hclen=rb(d,4,4);const L=new Uint8Array(320);
    for(let i=0;i<hclen;i++)L[clcidx[i]]=rb(d,3,0);build(codeTree,L,0,19);L.fill(0,0,19);
    for(let num=0;num<hlit+hdist;){const sym=dsym(d,codeTree);
      if(sym===16){const prev=L[num-1];for(let l=rb(d,2,3);l;--l)L[num++]=prev;}
      else if(sym===17){for(let l=rb(d,3,3);l;--l)L[num++]=0;}
      else if(sym===18){for(let l=rb(d,7,11);l;--l)L[num++]=0;}
      else L[num++]=sym;}
    build(lt,L,0,hlit);build(dt,L,hlit,hdist);}
  function grow(d,n){if(d.o+n>d.out.length){let nl=d.out.length*2;while(nl<d.o+n)nl*=2;const no=new Uint8Array(nl);no.set(d.out.subarray(0,d.o));d.out=no;}}
  function data(d,lt,dt){for(;;){let sym=dsym(d,lt);if(sym===256)return;
      if(sym<256){if(d.o>=d.out.length)grow(d,1);d.out[d.o++]=sym;}
      else{sym-=257;const length=rb(d,lenBits[sym],lenBase[sym]);const ds=dsym(d,dt);const off=d.o-rb(d,distBits[ds],distBase[ds]);
        if(off<0)throw new Error('Corrupt deflate stream');grow(d,length);const o=d.out;for(let i=off,e=off+length;i<e;i++)o[d.o++]=o[i];}}}
  function stored(d){while(d.bc>8){d.i--;d.bc-=8;}const len=d.s[d.i+1]*256+d.s[d.i];d.i+=4;grow(d,len);
    d.out.set(d.s.subarray(d.i,d.i+len),d.o);d.o+=len;d.i+=len;d.bc=0;d.tag=0;}
  function raw(src,pos=0,hint=0){const d=new D(src,pos,hint);let fin;
    do{fin=getbit(d);const t=rb(d,2,0);if(t===0)stored(d);else if(t===1)data(d,sltree,sdtree);else if(t===2){trees(d,d.lt,d.dt);data(d,d.lt,d.dt);}else throw new Error('Bad deflate block');
      if(d.i>src.length+8)throw new Error('Truncated deflate stream');}while(!fin);
    return{data:d.out.subarray(0,d.o),end:d.i-(d.bc>>3)};}
  function zlib(src,hint){if((src[0]&0x0f)!==8)return raw(src,0,hint).data;return raw(src,2,hint).data;}
  function isGz(b){return b.length>2&&b[0]===0x1f&&b[1]===0x8b;}
  function gunzip(src){const parts=[];let p=0,total=0;
    while(p+18<=src.length&&src[p]===0x1f&&src[p+1]===0x8b){const flg=src[p+3];let q=p+10;
      if(flg&4){const xlen=src[q]|(src[q+1]<<8);q+=2+xlen;}
      if(flg&8){while(src[q++]!==0);} if(flg&16){while(src[q++]!==0);} if(flg&2)q+=2;

  for(const r of S.rows){if(!map.has(r.id)&&!(S.tree&&r.extra&&isMappedAway(r.id))){r.extra=!!S.tree;rows.push(r);map.set(r.id,r);}}
  S.rows=rows;S.rowById=map;}
function isMappedAway(id){return S.genomeMap[id]&&S.genomeMap[id]!==id;}
function visibleRows(){return S.rows.filter(r=>r.visible);}

/* =====================================================================
   9. DATA PREPARATION FOR A REGION
   ===================================================================== */
async function computeMafBins(t,chrom,start,end,nBins,opt={}){
  const L=end-start;const perBase=nBins>=L;if(perBase)nBins=L;const k=nBins/L;const sp=new Map();
  const get=id=>{let a=sp.get(id);if(!a){a={cov:new Float32Array(nBins),match:new Float32Array(nBins),gap:new Float32Array(nBins),ins:new Float32Array(nBins),
      base:new Float32Array(nBins*4),mm:new Float32Array(nBins*4),chars:perBase?new Uint8Array(nBins):null};sp.set(id,a);}return a;};
  let nBlocks=0,refId=null;
  await t.aln.forEachBlock(chrom,start,end,blk=>{nBlocks++;const rows=blk.rows,ref=rows[blk.refIdx].text;
    const slotIds=[],slotOf=new Int32Array(rows.length);const idPos=new Map();
    for(let i=0;i<rows.length;i++){const g=Genomes.genomeOf(rows[i].src);const id=rowIdForGenome(g);let s=idPos.get(id);if(s==null){s=slotIds.length;idPos.set(id,s);slotIds.push(id);}slotOf[i]=s;}
    if(!refId)refId=slotIds[slotOf[blk.refIdx]];
    const arrs=slotIds.map(id=>{ensureRow(id);return get(id);});const ns=slotIds.length;const chosen=new Int32Array(ns);const texts=rows.map(r=>r.text);
    let pos=blk.start;const n=ref.length;
    for(let c=0;c<n;c++){const rc=ref.charCodeAt(c);const ins=rc===45;
      if(!ins&&(pos<start||pos>=end)){pos++;continue;}
      if(ins&&(pos<start||pos>=end))continue;
      chosen.fill(-1);for(let i=0;i<rows.length;i++){const s=slotOf[i];const ch=texts[i].charCodeAt(c);if(chosen[s]===-1||(chosen[s]===45&&ch!==45))chosen[s]=ch;}
      const b=perBase?pos-start:Math.floor((pos-start)*k);
      if(ins){for(let s=0;s<ns;s++)if(chosen[s]!==45&&chosen[s]>0)arrs[s].ins[b]++;continue;}
      const ru=rc&0xDF;
      for(let s=0;s<ns;s++){const ch=chosen[s];const a=arrs[s];
        if(ch===45){a.gap[b]++;continue;}a.cov[b]++;const bi=ch<128?BASE_IDX[ch]:-1;
        if((ch&0xDF)===ru)a.match[b]++;else if(bi>=0)a.mm[b*4+bi]++;
        if(bi>=0)a.base[b*4+bi]++;if(perBase)a.chars[b]=ch;}
      pos++;}
  },opt);
  return{start,end,nBins,perBase,sp,refId,nBlocks};}

/* regions (e.g. ATAC peaks) that the alignment is restricted to, merged and padded */
function focusSource(t){return S.tracks.find(x=>x.id===t.focusTrack&&(x.idx||x.bbi));}
async function trackIntervals(ft,chrom,start,end){if(ft.idx)return ft.idx.query(chrom,start,end);const out=[];await ft.bbi.bedRecords(chrom,start,end,(s,e,rest)=>{const f=rest.split('\t');out.push({chrom,start:s,end:e,name:f[0]&&f[0]!=='.'?f[0]:'',score:+f[1]||0,signal:f.length>=7?+f[3]:NaN});});return out;}
async function focusIntervals(t,chrom,start,end){const ft=focusSource(t);if(!ft)return null;const pad=t.focusPad||0;
  const iv=(await trackIntervals(ft,chrom,start-pad,end+pad)).map(f=>[f.start-pad,f.end+pad]).sort((a,b)=>a[0]-b[0]);const m=[];for(const x of iv){const l=m[m.length-1];if(l&&x[0]<=l[1])l[1]=Math.max(l[1],x[1]);else m.push([...x]);}return m;}
function focusMask(d,nb){const m=new Uint8Array(nb);if(!d.focus){m.fill(1);return m;}const L=d.end-d.start;
  for(const [s,e] of d.focus){const b0=Math.max(0,Math.floor((s-d.start)*nb/L)),b1=Math.min(nb,Math.ceil((e-d.start)*nb/L));for(let b=b0;b<b1;b++)m[b]=1;}return m;}
async function prepareData(region,nBins,opt={}){const D={};const {chrom,start,end}=region;const L=end-start;
  for(const t of S.tracks){if(!t.visible)continue;try{
    if(t.kind==='maf'){D[t.id]=L>(opt.maxWindow||S.style.maxAlnWindow)?{tooWide:true}:await computeMafBins(t,chrom,start,end,nBins,opt);if(t.focusTrack)D[t.id].focus=await focusIntervals(t,chrom,start,end);}
    else if(t.kind==='peaks'||t.kind==='genes'){
      if(t.bbi){const out=[];await t.bbi.bedRecords(chrom,start,end,(s,e,rest)=>{const f=rest.split('\t');const ft={chrom,start:s,end:e,name:f[0]&&f[0]!=='.'?f[0]:'',score:+f[1]||0,strand:f[2]||'.'};
          if(f.length>=7&&t.bedKind!=='bed12'){ft.signal=+f[3];ft.p=+f[4];ft.q=+f[5];ft.summit=+f[6]>=0?s+(+f[6]):-1;}
          if(f.length>=9&&/^[\d,]+$/.test(f[7]||'')){const n=+f[6],sz=f[7].split(','),st=f[8].split(',');ft.exons=[];for(let i=0;i<n;i++)ft.exons.push([s+(+st[i]),s+(+st[i])+(+sz[i])]);}
          out.push(ft);});D[t.id]=out;}
      else D[t.id]=t.idx.query(chrom,start,end);}
    else if(t.kind==='signal'){D[t.id]=t.bbi?await t.bbi.wigBins(chrom,start,end,Math.min(nBins,L)):t.sig.bins(chrom,start,end,Math.min(nBins,L));}
    else if(t.kind==='seq'){D[t.id]=(nBins/L>=1.2)?{seq:await t.fa.seq(chrom,start,end)}:{zoomOut:true};}
  }catch(err){console.error(err);D[t.id]={error:err.message};}}
  return D;}

const mctx=document.createElement('canvas').getContext('2d');
function fontStr(sz,it,bd,fam){return`${it?'italic ':''}${bd?'600 ':''}${sz}px ${fam||S.style.font}, Arial, sans-serif`;}
function textW(s,sz,it,bd,fam){mctx.font=fontStr(sz,it,bd,fam);return mctx.measureText(s).width;}
/* inline markup for text labels: *italic*  **bold** */
function richRuns(line){const out=[];const re=/(\*\*[^*]+\*\*|\*[^*]+\*)/g;let last=0,m;
  while((m=re.exec(line))){if(m.index>last)out.push({s:line.slice(last,m.index)});const b=m[0].startsWith('**');out.push({s:m[0].slice(b?2:1,b?-2:-1),bold:b,italic:!b});last=m.index+m[0].length;}
  if(last<line.length)out.push({s:line.slice(last)});if(!out.length)out.push({s:''});return out;}
const TEXT_FONTS=['Arial','Helvetica','Times New Roman','Georgia','Calibri','Verdana','Garamond','Courier New','IBM Plex Sans','IBM Plex Mono'];
function hexRgb(h){if(h.startsWith('rgb')){const m=h.match(/\d+/g);return m.map(Number);}h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');return[0,2,4].map(i=>parseInt(h.slice(i,i+2),16));}
function lerpColor(a,b,t){const A=hexRgb(a),B=hexRgb(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('');}
function lum(c){const [r,g,b]=hexRgb(c);return(0.299*r+0.587*g+0.114*b)/255;}
function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x)));const m=x/p;return(m<1.5?1:m<3.5?2:m<7.5?5:10)*p;}
function baseColor(i){const s=S.style;return[s.baseA,s.baseC,s.baseG,s.baseT][i]??s.baseN;}
function charColor(ch){const i=ch<128?BASE_IDX[ch]:-1;return baseColor(i);}

function treeLayout(rowsY){// rowsY: Map leafName->y of visible rows. returns drawable list
  const st=S.style;const vis=n=>!n.children.length?rowsY.has(n.name):n.children.some(vis);
  const nodes=[];
  const depthOf=(n,d)=>{n._d=d+(n.parent&&n.len!=null?n.len:(n.parent?1:0));n.children.forEach(c=>depthOf(c,n._d));};
  depthOf(S.tree,0);
  const heightOf=n=>{const vc=n.children.filter(vis);n._h=vc.length?Math.max(...vc.map(heightOf))+1:0;return n._h;};
  heightOf(S.tree);
  const useLen=st.treeMode==='phylogram'&&leavesOf(S.tree).every(l=>l===S.tree||l.len!=null);
  let maxD=0;for(const l of leavesOf(S.tree))if(rowsY.has(l.name))maxD=Math.max(maxD,l._d-S.tree._d);
  const maxH=S.tree._h||1;
  const place=(n)=>{const vc=n.children.filter(vis);
    if(vc.length===1&&n!==S.tree){return place(vc[0]);}// collapse pass-through
    const node={n,kids:[]};
    if(!vc.length){node.y=rowsY.get(n.name);node.leaf=true;}
    else{node.kids=vc.map(place);node.y=(node.kids[0].y+node.kids[node.kids.length-1].y)/2;}
    node.fx=useLen?(maxD?(n._d-S.tree._d)/maxD:1):(1-n._h/maxH);
    nodes.push(node);return node;};
  const root=place(S.tree);return{root,nodes,useLen};}

function buildScene(D,o){
  const st=S.style;const ops=[];const hit={rows:[],feats:[],nodes:[],labels:[],tracks:[],maf:null,texts:[],boxes:[]};
  const W=o.width;const {chrom,start,end}=o.region;const L=end-start;const fs=TS('feature').size;
  const tracks=S.tracks.filter(t=>t.visible);const mt=tracks.find(t=>t.kind==='maf');const rows=mt?visibleRows():[];
  const P=!!o.panelOnly;const hasTree=!P&&!!(st.showTree&&S.tree&&mt);const treeW=hasTree?st.treeWidth:0;
  const tSp=TS('species'),tTr=TS('track'),tCh=TS('chrom'),tRu=TS('ruler'),tSc=TS('scale'),tTi=TS('title'),tHl=TS('highlight');
  const gapLA=P?0:(st.labelAlnGap??8),gapTL=st.treeLabelGap??4;

  if(!labelW&&!P){labelW=10;for(const r of rows){const isRef=r.id===S.refId;labelW=Math.max(labelW,textW(displayLabel(r),tSp.size,st.italicSpecies,tSp.bold||(st.boldRef&&isRef))+2);}
    // track names may use the empty tree column; only widen when they would not fit
    let need=0;if(st.showTrackLabels)for(const t of tracks)if(t.kind!=='maf'&&t.showName!==false)need=Math.max(need,Math.min(320,textW(t.name,tTr.size,false,tTr.bold)+2));
    if(mt&&t_consShown(tracks))need=Math.max(need,textW('Conservation',tTr.size,false,tTr.bold)+2);
    const avail=treeW+(hasTree?gapTL:0)+labelW;if(need>avail)labelW+=need-avail;
    labelW=Math.ceil(labelW);}
  const padL=P?2:8;const dataX=padL+treeW+(hasTree?gapTL:0)+labelW+gapLA;const dataW=Math.max(40,W-dataX-12);const nameRight=dataX-gapLA,nameClip=nameRight-padL;
  const xOf=p=>dataX+(p-start)/L*dataW;
  let y=8;const sections=[];
  const ttl=o.panelTitle!=null?o.panelTitle:(o.noTitle?'':st.title);if(ttl){sections.push({type:'title',y});y+=(o.panelTitle!=null?tTr.size*1.7:tTi.size*1.6);}
  const rulerY=y;const sbH=st.showScaleBar?Math.max(16,tSc.size+7):0,ruH=st.showRuler?Math.max(tRu.size,tCh.size)+20:0;if(st.showRuler||st.showScaleBar){y+=ruH+sbH+(st.showRuler?0:6);}
  const tracksTop=y;const secH={};
  for(const t of tracks){const d=D[t.id];let h=0;
    if(t.kind==='maf')h=Math.max(rows.length,1)*mafRowH()+4+(t.showCons?(t.consH||36)+6:0);
    else if(t.kind==='signal')h=t.height||46;
    else if(t.kind==='seq')h=d&&d.seq?14:(o.export?0:14);
    else if(t.kind==='peaks'||t.kind==='genes'){const lay=stackFeatures(t,d||[],xOf,dataX,dataW,fs);t._lay=lay;h=Math.max(lay.nRows,1)*lay.rowH+4;}
    if(h<=0)continue;secH[t.id]=h;if(o.fixedH&&o.fixedH[t.id]!=null)h=o.fixedH[t.id];sections.push({type:'track',t,y,h});y+=h+st.trackGap;}
  // free text labels (drawn last, on top)
  const tboxes=[];for(const tx of (o.noAnnot?[]:S.texts)){if(tx.hidden)continue;if(tx.anchor==='genome'&&!sameChrom(tx.chrom,chrom))continue;
    const ax=tx.anchor==='genome'?xOf(tx.pos):tx.fx*W;const sz=tx.size,lh=sz*1.25,pad=(tx.bg||tx.border)?(tx.pad??3):0;
    const lines=String(tx.text||'').split('\n').map(l=>{const runs=richRuns(l);let w=0;for(const r of runs){r.w=textW(r.s,sz,tx.italic||r.italic,tx.bold||r.bold,tx.font);w+=r.w;}return{runs,w};});
    const w=Math.max(4,...lines.map(l=>l.w)),h=lines.length*lh;const x0=tx.align==='middle'?ax-w/2:tx.align==='end'?ax-w:ax;
    if(x0+w<-20||x0>W+20)continue;tboxes.push({tx,ax,x0,y0:tx.y,w,h,lh,lines,pad});}
  const bgeo=[];for(const bx of (o.noAnnot?[]:S.boxes)){if(bx.hidden)continue;if(bx.anchor==='genome'&&!sameChrom(bx.chrom,chrom))continue;
    let x0=bx.anchor==='genome'?xOf(bx.start):bx.fx0*W,x1=bx.anchor==='genome'?xOf(bx.end):bx.fx1*W;if(x1<x0)[x0,x1]=[x1,x0];
    if(x1<-50||x0>W+50)continue;bgeo.push({bx,x0,x1,y0:bx.y,y1:bx.y+bx.h});}
  let H=Math.ceil(y+6);for(const b of tboxes)H=Math.max(H,Math.ceil(b.y0+b.h+b.pad+6));for(const g of bgeo)H=Math.max(H,Math.ceil(g.y1+(g.bx.border?g.bx.sw:0)+4));
  const boxOp=g=>{const bx=g.bx;return{t:'box',x:g.x0,y:g.y0,w:g.x1-g.x0,h:g.y1-g.y0,fill:bx.noFill?null:bx.fill,fop:bx.fillOp??0.3,stroke:bx.border?bx.stroke:null,sw:bx.sw||1,dash:bx.dash?`${(bx.sw||1)*4} ${(bx.sw||1)*3}`:null,rx:bx.radius||0};};

  ops.push({t:'/g'});

    if(sec.type==='title'){if(o.panelTitle!=null)ops.push({t:'text',x:dataX+dataW/2,y:sec.y+tTr.size*0.7,s:ttl,size:tTr.size,fill:tTr.fill,bold:true,anchor:'middle'});else ops.push({t:'text',x:padL,y:sec.y+tTi.size*0.6,s:ttl,size:tTi.size,fill:tTi.fill,bold:tTi.bold});continue;}

    if(!P&&t.kind!=='maf'&&st.showTrackLabels&&t.showName!==false){ops.push({t:'text',x:nameRight,y:sec.y+Math.min(sec.h/2,tTr.size*0.9),s:t.name,size:tTr.size,fill:t.nameColor||tTr.fill,bold:tTr.bold,anchor:'end',clip:nameClip});}
    if(d&&d.error){ops.push({t:'text',x:dataX+4,y:sec.y+sec.h/2,s:'Error: '+d.error,size:fs-1,fill:'#b00020'});ops.push({t:'/g'});continue;}
    if(t.kind==='maf')drawMaf(ops,hit,t,d,rows,sec,{dataX,dataW,padL,treeW,labelW,hasTree,xOf,o,nameRight,gapTL,P});
    else if(t.kind==='signal')drawSignal(ops,t,d,sec,dataX,dataW,nameRight,o);
    else if(t.kind==='peaks'||t.kind==='genes')drawFeatures(ops,hit,t,sec,xOf,dataX,dataW,fs);
    else if(t.kind==='seq')drawSeq(ops,t,d,sec,dataX,dataW,L,fs,o);
    ops.push({t:'/g'});}

    if(st.showRuler){const step=niceStep(L/(dataW/Math.max(95,tRu.size*9)));const by=rulerY+sbH+ruH-6;ops.push({t:'line',x1:dataX,y1:by,x2:dataX+dataW,y2:by,stroke:'#222',sw:1});
      if(!P)ops.push({t:'text',x:nameRight,y:by-tCh.size*0.6,s:chrom,size:tCh.size,fill:tCh.fill,anchor:'end',bold:tCh.bold});
      const minor=step/5;for(let p=Math.ceil(start/minor)*minor;p<=end;p+=minor){const x=xOf(p);const major=Math.abs(p/step-Math.round(p/step))<1e-6;
        ops.push({t:'line',x1:x,y1:by,x2:x,y2:by-(major?6:3),stroke:'#222',sw:1});

      ops.push({t:'line',x1:sx,y1:sy,x2:sx+px,y2:sy,stroke:'#111',sw:2});ops.push({t:'line',x1:sx,y1:sy-3,x2:sx,y2:sy+3,stroke:'#111',sw:1});ops.push({t:'line',x1:sx+px,y1:sy-3,x2:sx+px,y2:sy+3,stroke:'#111',sw:1});
      ops.push({t:'text',x:sx-6,y:sy,s:fmtBp(len),size:tSc.size,fill:tSc.fill,bold:tSc.bold,anchor:'end'});}

  for(const g of bgeo){hit.boxes.push(g);if(o.selBox===g.bx.id){const hw=3.5;ops.push({t:'box',x:g.x0,y:g.y0,w:g.x1-g.x0,h:g.y1-g.y0,fill:null,stroke:'#3b5bdb',sw:1,dash:'4 3'});
      for(const [hx,hy] of [[g.x0,g.y0],[g.x1,g.y0],[g.x0,g.y1],[g.x1,g.y1],[(g.x0+g.x1)/2,g.y0],[(g.x0+g.x1)/2,g.y1],[g.x0,(g.y0+g.y1)/2],[g.x1,(g.y0+g.y1)/2]])ops.push({t:'box',x:hx-hw,y:hy-hw,w:hw*2,h:hw*2,fill:'#ffffff',fop:1,stroke:'#3b5bdb',sw:1});}}

/* phylogenetic weights: each branch's length is shared equally among the leaves below it, so a clade of
   many close relatives counts about as much as one lineage of the same total depth */
function treeWeights(){if(!S.tree)return null;const has=leavesOf(S.tree).every(l=>l.len!=null);if(!has)return null;const w=new Map();
  (function go(n,acc){const nl=leavesOf(n).length;const a=acc+(n.parent&&n.len?n.len/nl:0);if(!n.children.length)w.set(n.name,a);else n.children.forEach(c=>go(c,a));})(S.tree,0);return w;}
function mafRowH(){return Math.max(S.style.rowHeight,Math.ceil(TS('species').size*1.08));}
function t_consShown(tracks){return tracks.some(t=>t.kind==='maf'&&t.showCons);}
function sameChrom(a,b){return a===b||chromKey(a)===chromKey(b);}

function drawMaf(ops,hit,t,d,rows,sec,g){const st=S.style;const rh=mafRowH();const tSp=TS('species'),tTr=TS('track'),tAx=TS('axis');const fs=tSp.size;let y0=sec.y+2;
  const {dataX,dataW,padL,treeW,labelW,hasTree,nameRight}=g;
  if(t.showCons){const ch=t.consH||36;const top=sec.y+2,base=top+ch;
    ops.push({t:'g',name:'conservation'});if(!g.P&&st.showTrackLabels&&t.consLabel!==false)ops.push({t:'text',x:nameRight,y:top+tTr.size*0.7,s:t.consName||'Conservation',size:tTr.size,fill:tTr.fill,bold:tTr.bold,anchor:'end'});
    if(d&&!d.tooWide){const others=rows.filter(r=>r.id!==d.refId&&d.sp.get(r.id));const nb=d.nBins,bw=dataW/nb,binBp=(d.end-d.start)/nb;
      if(others.length){const tw=(t.consWeight||'tree')==='tree'?treeWeights():null;const wt=others.map(r=>tw&&tw.has(r.id)?Math.max(1e-6,tw.get(r.id)):1);const wsum=wt.reduce((a,b)=>a+b,0);const arrs=others.map(r=>d.sp.get(r.id).match);
        const mask=focusMask(d,nb);const hideOut=(t.focusMode||'hide')==='hide';const paths=['',''];let cur=-1;
        for(let b=0;b<nb;b++){const k=mask[b]?0:1;if(k===1&&hideOut){if(cur>=0){paths[cur]+=`L${(dataX+b*bw).toFixed(2)} ${base}Z`;cur=-1;}continue;}
          let s=0;for(let i=0;i<arrs.length;i++)s+=wt[i]*arrs[i][b]/binBp;const v=s/wsum;const yv=(base-v*ch).toFixed(2);const xa=(dataX+b*bw).toFixed(2),xb=(dataX+(b+1)*bw).toFixed(2);
          if(k!==cur){if(cur>=0)paths[cur]+=`L${xa} ${base}Z`;paths[k]+=`M${xa} ${base}`;cur=k;}paths[k]+=`L${xa} ${yv}L${xb} ${yv}`;}
        if(cur>=0)paths[cur]+=`L${(dataX+nb*bw).toFixed(2)} ${base}Z`;
        if(paths[0])ops.push({t:'path',d:paths[0],fill:t.consColor||st.highIdColor});if(paths[1])ops.push({t:'path',d:paths[1],fill:t.consColor||st.highIdColor,op:t.focusDim??0.15});}}
    ops.push({t:'line',x1:dataX,y1:base,x2:dataX+dataW,y2:base,stroke:'#bbb',sw:0.6});if(!g.P)ops.push({t:'text',x:nameRight,y:base-tAx.size*0.5,s:'0–100%',size:tAx.size,fill:tAx.fill,bold:tAx.bold,anchor:'end'});ops.push({t:'/g'});
    y0+=ch+6;}
  const rowsY=new Map();rows.forEach((r,i)=>rowsY.set(r.id,y0+i*rh+rh/2));
  // tree
  if(hasTree){const lay=treeLayout(rowsY);const tx=x=>padL+x*treeW;
    const colorOf=n=>{for(let p=n;p;p=p.parent)if(p.color)return p.color;return st.treeColor;};
    ops.push({t:'g',name:'tree'});
    const drawNode=(nd,px)=>{const x=tx(nd.fx);const col=colorOf(nd.n);
      if(px!=null)ops.push({t:'line',x1:px,y1:nd.y,x2:x,y2:nd.y,stroke:col,sw:st.treeLineWidth});
      if(nd.kids.length){ops.push({t:'line',x1:x,y1:nd.kids[0].y,x2:x,y2:nd.kids[nd.kids.length-1].y,stroke:col,sw:st.treeLineWidth,cap:'square'});nd.kids.forEach(k=>drawNode(k,x));
        hit.nodes.push({x,y:nd.y,node:nd.n});}
      else if(lay.useLen&&st.alignLabels&&x<padL+treeW-2)ops.push({t:'line',x1:x+2,y1:nd.y,x2:padL+treeW,y2:nd.y,stroke:'#999',sw:0.6,dash:'1.5 2'});};
    drawNode(lay.root,null);ops.push({t:'/g'});}
  // labels
  if(!g.P){ops.push({t:'g',name:'species labels'});const lx=padL+treeW+(hasTree?g.gapTL:0);
  rows.forEach((r,i)=>{const yc=y0+i*rh+rh/2;const isRef=r.id===S.refId;
    const col=r.color||(()=>{if(!S.tree)return null;const leaf=leavesOf(S.tree).find(l=>l.name===r.id);for(let p=leaf;p;p=p.parent)if(p.color)return p.color;return null;})()||tSp.fill;
    ops.push({t:'text',x:lx,y:yc,s:displayLabel(r),size:fs,fill:col,italic:st.italicSpecies,bold:tSp.bold||(st.boldRef&&isRef)});
    hit.labels.push({x0:lx,x1:lx+labelW,y0:yc-rh/2,y1:yc+rh/2,row:r});hit.rows.push({y0:yc-rh/2,y1:yc+rh/2,row:r});});
  ops.push({t:'/g'});}
  if(!d){return;}
  if(d.tooWide){ops.push({t:'text',x:dataX+dataW/2,y:y0+Math.min(rows.length*rh/2,40),s:`Zoom in to see the alignment (view ${fmtBp(g.o.region.end-g.o.region.start)}, limit ${fmtBp(st.maxAlnWindow)})`,size:fs,fill:'#666',anchor:'middle'});return;}
  hit.maf={d,y0,rh,rows,dataX,dataW};

  const nb=d.nBins,bw=dataW/nb;const ch=Math.max(1,st.rowHeight*st.cellFill),letters=d.perBase&&bw>=st.letterMinPx;
  const idCache=new Map();const idColor=id=>{const q=Math.round(Math.max(0,Math.min(1,(id-st.idFloor)/(1-st.idFloor)))*24);let c=idCache.get(q);if(!c){c=lerpColor(st.lowIdColor,st.highIdColor,q/24);idCache.set(q,c);}return c;};
  const mask=focusMask(d,nb);const hideOut=(t.focusMode||'hide')==='hide';const dimOp=t.focusDim??0.15;
  rows.forEach((r,i)=>{const a=d.sp.get(r.id);if(!a)return;const top=y0+i*rh;const cy=top+(rh-ch)/2,my=top+rh/2;const isRef=r.id===d.refId;
    let rt=0,rc=null,rx=0,rm=1;const flush=xe=>{const op=rm?1:dimOp;if(rt===1)ops.push({t:'rect',x:rx,y:cy,w:xe-rx,h:ch,fill:rc,op});else if(rt===2)ops.push({t:'line',x1:rx,y1:my,x2:xe,y2:my,stroke:rc,sw:st.gapLineWidth,op});rt=0;};
    for(let b=0;b<nb;b++){const cov=a.cov[b];let type=0,col=null;const mk=mask[b];
      if(!mk&&hideOut){if(rt){flush(dataX+b*bw);}continue;}
      if(cov>0){type=1;const match=a.match[b];
        if(st.alnMode==='identity')col=idColor(match/cov);
        else if(st.alnMode==='bases'){let bi=-1,bm=0;for(let j=0;j<4;j++)if(a.base[b*4+j]>bm){bm=a.base[b*4+j];bi=j;}col=baseColor(bi);}
        else{const mmT=cov-match;if(mmT>0&&(d.perBase||mmT/cov>=0.34)){let bi=-1,bm=0;for(let j=0;j<4;j++)if(a.mm[b*4+j]>bm){bm=a.mm[b*4+j];bi=j;}col=baseColor(bi);}else col=st.matchColor;}}
      else if(a.gap[b]>0&&st.showGaps){type=2;col=st.gapColor;}
      if(type!==rt||col!==rc||mk!==rm){flush(dataX+b*bw);if(type){rt=type;rc=col;rm=mk;rx=dataX+b*bw;}}}

function drawSignal(ops,t,d,sec,dataX,dataW,nameRight,o={}){const tAx=TS('axis');if(!d)return;const arr=t.summary==='mean'?d.mean:d.max;const n=arr.length;if(!n)return;
  let mx=t.scaleMax>0?t.scaleMax:(o.signalMax&&o.signalMax[t.id]>0?o.signalMax[t.id]:0);if(!(mx>0))for(let i=0;i<n;i++)if(arr[i]>mx)mx=arr[i];if(!(mx>0))mx=1;
  const tf=v=>t.log?Math.log1p(Math.max(0,v))/Math.log1p(mx):Math.min(1,Math.max(0,v)/mx);
  const top=sec.y+2,h=sec.h-4,base=top+h,bw=dataW/n;
  if(t.display==='heatmap'){let run=null,rx=0;const flush=x=>{if(run)ops.push({t:'rect',x:rx,y:top,w:x-rx,h,fill:run});run=null;};
    for(let i=0;i<n;i++){const v=arr[i];const c=isNaN(v)||v<=0?null:lerpColor('#ffffff',t.color,Math.round(tf(v)*20)/20);if(c!==run){flush(dataX+i*bw);if(c){run=c;rx=dataX+i*bw;}}}flush(dataX+n*bw);}

      const yv=(base-tf(v)*h).toFixed(2),x0=(dataX+i*bw).toFixed(2),x1=(dataX+(i+1)*bw).toFixed(2);
      if(!inRun){path+=`M${x0} ${base}L${x0} ${yv}`;inRun=true;}else path+=`L${x0} ${yv}`;path+=`L${x1} ${yv}`;}
    if(inRun)path+=`L${(dataX+n*bw).toFixed(2)} ${base}Z`;

    ops.push({t:'line',x1:dataX,y1:base,x2:dataX+dataW,y2:base,stroke:'#bbb',sw:0.6});}

function stackFeatures(t,feats,xOf,dataX,dataW,fs){const genes=t.kind==='genes';const st=S.style;
  let list=feats;if(genes&&(t.isoforms==='longest'||t.collapse)&&t.idx){const ls=longestSet(t);list=feats.filter(f=>ls.has(f));}
  const mode=t.mode||'expanded';

  const showLabels=mode==='squished'?false:(genes?t.labels!==false:!!t.labels);const rowH=mode==='squished'?6:genes?(showLabels?fh+fs+3:fh+4):fh+(showLabels?fs+2:3);
  const ends=[];const placed=[];const maxRows=mode==='collapsed'?1:(t.maxRows||(genes?12:6))*(mode==='squished'?3:1);
  const tFe=TS('feature');for(const f of list){const x0=xOf(f.start),x1=xOf(f.end);const nm=showLabels?featLabel(f,t):'';const lab=nm?textW(nm,tFe.size,genes&&st.italicGenes,tFe.bold)+6:0;const right=Math.max(x1,x0+lab)+3;
    let r=0;while(r<ends.length&&ends[r]>x0)r++;if(r>=maxRows){r=maxRows-1;}ends[r]=Math.max(ends[r]||-1e9,right);placed.push({f,r});}
  return{placed,rowH,nRows:Math.max(1,Math.min(maxRows,ends.length)),showLabels};}

function drawFeatures(ops,hit,t,sec,xOf,dataX,dataW,fs){const lay=t._lay;if(!lay)return;const st=S.style;const genes=t.kind==='genes';
  const fh=t._fh||t.featH||(genes?10:9);const clip=x=>Math.max(dataX-2,Math.min(dataX+dataW+2,x));
  let maxScore=0;if(!genes&&t.shadeByScore)for(const p of lay.placed)maxScore=Math.max(maxScore,p.f.signal||p.f.score||0);
  for(const {f,r} of lay.placed){const top=sec.y+2+r*lay.rowH;const cy=top+fh/2;const x0=clip(xOf(f.start)),x1=clip(xOf(f.end));const col=f.color||t.color;
    if(genes&&f.exons&&f.exons.length>0&&(f.exons.length>1||f.cds?.length)){
      ops.push({t:'line',x1:x0,y1:cy,x2:x1,y2:cy,stroke:col,sw:1});
      if(f.strand==='+'||f.strand==='-'){const dir=f.strand==='+'?1:-1;for(let x=x0+12;x<x1-6;x+=24){ops.push({t:'path',d:`M${(x-2.5*dir).toFixed(1)} ${cy-2.5}L${(x+1.5*dir).toFixed(1)} ${cy}L${(x-2.5*dir).toFixed(1)} ${cy+2.5}`,stroke:col,sw:0.9,fill:'none'});}}

      if(hasCds)for(const [s,e] of f.cds){const a=clip(xOf(s)),b=clip(xOf(e));if(b<dataX||a>dataX+dataW)continue;ops.push({t:'rect',x:a,y:cy-fh/2,w:Math.max(0.8,b-a),h:fh,fill:col});}}
    else{let op=1;if(!genes&&t.shadeByScore&&maxScore>0)op=0.25+0.75*Math.min(1,(f.signal||f.score||0)/maxScore);
      ops.push({t:'rect',x:x0,y:cy-fh/2,w:Math.max(1,x1-x0),h:fh,fill:col,op});
      if(f.summit>=0&&t.showSummit!==false){const sx=xOf(f.summit);if(sx>=dataX&&sx<=dataX+dataW)ops.push({t:'line',x1:sx,y1:cy-fh/2-1.5,x2:sx,y2:cy+fh/2+1.5,stroke:'#111',sw:1});}
      if(genes&&(f.strand==='+'||f.strand==='-')&&x1-x0>14){const dir=f.strand==='+'?1:-1;for(let x=x0+8;x<x1-4;x+=20)ops.push({t:'path',d:`M${(x-2*dir).toFixed(1)} ${cy-2}L${(x+1.5*dir).toFixed(1)} ${cy}L${(x-2*dir).toFixed(1)} ${cy+2}`,stroke:'#fff',sw:0.9,fill:'none'});}}

    hit.feats.push({x0:x0-2,x1:Math.max(x1,x0+3)+2,y0:top-1,y1:top+lay.rowH-1,f,t});}}

function drawSeq(ops,t,d,sec,dataX,dataW,L,fs,o){if(!d)return;
  if(!d.seq){if(!o.export)ops.push({t:'text',x:dataX+4,y:sec.y+7,s:'Zoom in to see the reference sequence',size:fs-2,fill:'#888'});return;}
  const bw=dataW/L;const s=d.seq;let run=null,rx=0;const flush=x=>{if(run)ops.push({t:'rect',x:rx,y:sec.y+1,w:x-rx,h:12,fill:run});run=null;};
  for(let i=0;i<s.length;i++){const c=charColor(s.charCodeAt(i));if(c!==run){flush(dataX+i*bw);run=c;rx=dataX+i*bw;}}flush(dataX+s.length*bw);
  if(bw>=7)for(let i=0;i<s.length;i++)ops.push({t:'text',x:dataX+(i+.5)*bw,y:sec.y+7,s:s[i],size:Math.min(11,bw*.9),fill:'#fff',anchor:'middle',mono:true});}

function paint(ctx,ops){ctx.lineCap='butt';
  for(const op of ops){switch(op.t){
    case'rect':ctx.globalAlpha=op.op??1;if(op.fill!=='none'){ctx.fillStyle=op.fill;ctx.fillRect(op.x,op.y,op.w,op.h);}if(op.stroke){ctx.globalAlpha=1;ctx.strokeStyle=op.stroke;ctx.lineWidth=op.sw||1;ctx.strokeRect(op.x,op.y,op.w,op.h);}ctx.globalAlpha=1;break;
    case'line':ctx.globalAlpha=op.op??1;ctx.strokeStyle=op.stroke;ctx.lineWidth=op.sw||1;ctx.lineCap=op.cap||'butt';ctx.setLineDash(op.dash?op.dash.split(' ').map(Number):[]);ctx.beginPath();ctx.moveTo(op.x1,op.y1);ctx.lineTo(op.x2,op.y2);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;break;

    case'pop':ctx.restore();break;
    case'path':{const p=new Path2D(op.d);if(op.fill&&op.fill!=='none'){ctx.globalAlpha=op.op??1;ctx.fillStyle=op.fill;ctx.fill(p);ctx.globalAlpha=1;}if(op.stroke){ctx.strokeStyle=op.stroke;ctx.lineWidth=op.sw||1;ctx.stroke(p);}break;}
    case'text':{ctx.font=op.mono?`${op.bold?'600 ':''}${op.size}px "IBM Plex Mono", Menlo, Consolas, monospace`:fontStr(op.size,op.italic,op.bold);ctx.fillStyle=op.fill;ctx.textAlign=op.anchor==='middle'?'center':op.anchor==='end'?'right':'left';
      let s=op.s;if(op.clip&&op.clip>10&&ctx.measureText(s).width>op.clip){while(s.length>2&&ctx.measureText(s+'…').width>op.clip)s=s.slice(0,-1);s+='…';}
      ctx.fillText(s,op.x,op.y+op.size*0.35);break;}
    case'box':{ctx.beginPath();if(op.rx>0&&ctx.roundRect)ctx.roundRect(op.x,op.y,op.w,op.h,Math.min(op.rx,op.w/2,op.h/2));else ctx.rect(op.x,op.y,op.w,op.h);
      if(op.fill){ctx.globalAlpha=op.fop;ctx.fillStyle=op.fill;ctx.fill();ctx.globalAlpha=1;}
      if(op.stroke){ctx.strokeStyle=op.stroke;ctx.lineWidth=op.sw;ctx.setLineDash(op.dash?op.dash.split(' ').map(Number):[]);ctx.stroke();ctx.setLineDash([]);}break;}
    case'rich':{let x=op.x;const yy=op.y+op.size*0.35;ctx.fillStyle=op.fill;ctx.textAlign='left';
      for(const r of op.runs){ctx.font=fontStr(op.size,op.italic||r.italic,op.bold||r.bold,op.fam);ctx.fillText(r.s,x,yy);x+=r.w;}break;}
    case'chars':{ctx.font=`${op.size}px "IBM Plex Mono", Menlo, Consolas, monospace`;ctx.fillStyle=op.fill;ctx.textAlign='center';const yy=op.y+op.size*0.35;for(let i=0;i<op.s.length;i++)ctx.fillText(op.s[i],op.x0+(i+.5)*op.dx,yy);break;}
  }}}
function sceneToSVG(sc,opt={}){const st=S.style;const out=[];const n=v=>+(+v).toFixed(2);
  const wAttr=opt.widthMM?`${n(opt.widthMM)}mm`:sc.width,hAttr=opt.widthMM?`${n(opt.widthMM*sc.height/sc.width)}mm`:sc.height;
  out.push(`<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" width="${wAttr}" height="${hAttr}" viewBox="0 0 ${sc.width} ${sc.height}" font-family="${esc(st.font)}, Arial, sans-serif">`);
  for(const op of sc.ops){switch(op.t){
    case'g':out.push(`<g id="${esc(op.name.replace(/[^\w.-]+/g,'_'))}">`);break;
    case'/g':out.push('</g>');break;
    case'rect':out.push(`<rect x="${n(op.x)}" y="${n(op.y)}" width="${n(op.w)}" height="${n(op.h)}" fill="${op.fill}"${op.op!=null&&op.op<1&&op.fill!=='none'?` fill-opacity="${n(op.op)}"`:''}${op.stroke?` stroke="${op.stroke}" stroke-width="${op.sw||1}"`:''}/>`);break;
    case'line':out.push(`<line x1="${n(op.x1)}" y1="${n(op.y1)}" x2="${n(op.x2)}" y2="${n(op.y2)}" stroke="${op.stroke}" stroke-width="${op.sw||1}"${op.op!=null&&op.op<1?` stroke-opacity="${n(op.op)}"`:''}${op.dash?` stroke-dasharray="${op.dash}"`:''}${op.cap?` stroke-linecap="${op.cap}"`:''}/>`);break;
    case'push':out.push(`<g id="${esc((op.name||'panel').replace(/[^\w.-]+/g,'_'))}" transform="translate(${n(op.dx)},${n(op.dy)})">`);break;

    if(f.type)lines.push('type '+f.type);if(f.signal!=null&&!isNaN(f.signal))lines.push(`signal ${f.signal}  -log10p ${f.p}  -log10q ${f.q}`);if(f.score)lines.push('score '+f.score);lines.push('click to edit');}
  else if(h&&h.type==='box'){lines.length=0;lines.push('Box · drag to move · drag edges or corners to resize');}
  else if(h&&h.type==='text'){lines.length=0;lines.push('Text label · drag to move · click to edit');}
  else if(h&&h.type==='node'){lines.length=0;lines.push('Tree node · click to rotate / colour clade');}
  else if(h&&h.type==='label'){lines.length=0;lines.push(h.l.row.id+(S.refId===h.l.row.id?' (reference)':''),'click to rename');}
  if(!lines.length){hideTip();return;}tip.textContent=lines.join('\n');tip.hidden=false;
  const tw=tip.offsetWidth,th=tip.offsetHeight;let x=e.clientX+14,y=e.clientY+14;if(x+tw>innerWidth-6)x=e.clientX-tw-10;if(y+th>innerHeight-6)y=e.clientY-th-10;tip.style.left=x+'px';tip.style.top=y+'px';}

function renderSpecies(){const p=$('pane-species');const mt=mafTrack();let h='';

function setupDrop(el){['dragenter','dragover'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();el.classList.add('over');}));
  ['dragleave','drop'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();el.classList.remove('over');}));
  el.addEventListener('drop',e=>{if(e.dataTransfer.files.length)addFiles([...e.dataTransfer.files].map(fileSource));});}
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{e.preventDefault();if(e.target.closest('#drop'))return;if(e.dataTransfer.files.length)addFiles([...e.dataTransfer.files].map(fileSource));});
$('fileInput').onchange=e=>{addFiles([...e.target.files].map(fileSource));e.target.value='';};
$('sessionInput').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(f)loadSession(JSON.parse(await f.text()));};
function loadUrlDialog(){const el=pop(innerWidth/2-160,120,`<div class="ttl">Load from URL (server must allow range requests)</div><textarea id="urls" rows="4" placeholder="one URL per line" style="width:100%;font:12px var(--mono)"></textarea><div class="row" style="margin-top:6px"><button class="btn small primary" id="uok">Load</button></div>`,'form');
  el.querySelector('#uok').onclick=()=>{const u=el.querySelector('#urls').value.split('\n').map(x=>x.trim()).filter(Boolean);closePop();addFiles(u.map(urlSource));};}
function setTree(text,name){S.tree=parseNewick(text);S.treeFile=name||'pasted';Genomes.reset();
  for(const r of [...S.rows])if(!leavesOf(S.tree).some(l=>l.name===r.id)&&isMappedAway(r.id)){S.rows.splice(S.rows.indexOf(r),1);}
  // rows created from alignment genomes that now match leaves are merged
  const leafSet=new Set(leavesOf(S.tree).map(l=>l.name));S.rows=S.rows.filter(r=>leafSet.has(r.id)||!r.extra||true);
  syncRowsWithTree();const mt=mafTrack();if(mt&&mt.aln instanceof TextMafSource){mt.aln.index();}
  // drop alignment-derived rows that have no data anymore (will be recreated on render if needed)
  S.rows=S.rows.filter(r=>!r.extra||leafSet.has(r.id));S.rowById=new Map(S.rows.map(r=>[r.id,r]));
  renderSpecies();invalidate();toast(`Tree loaded: ${leafSet.size} species`);}
async function addFiles(srcs){if(!srcs.length)return;
  const byName=new Map(srcs.map(s=>[s.name,s]));const used=new Set();const errors=[];
  for(const s of srcs){if(used.has(s.name))continue;const n=s.name.toLowerCase();
    try{status('Reading '+s.name+'…',true);
      if(/\.(fai|tbi|csi|gzi|bai)$/.test(n))continue;
      if(n.endsWith('.json')){loadSession(JSON.parse(TD.decode(await s.readAll())));continue;}
      if(/\.(bb|bigbed)$/.test(n)){const b=await new BBI(s).open();
        if(b.type==='bigwig'){addTrack({kind:'signal',name:s.name,file:s.name,url:s.url,bbi:b});}
        else if(/mafBlock/i.test(b.autoSql)||/bigMaf/i.test(b.autoSql)){const aln=await new BigMafSource(b).init();addTrack({kind:'maf',name:s.name,file:s.name,url:s.url,aln});}
        else{const isGene=b.fieldCount>=12&&!/peak/i.test(b.autoSql);addTrack({kind:isGene?'genes':'peaks',name:s.name,file:s.name,url:s.url,bbi:b,bedKind:isGene?'bed12':(/narrowpeak|peak/i.test(b.autoSql+n)?'narrowPeak':'bed')});}
        continue;}
      if(/\.(bw|bigwig)$/.test(n)){const b=await new BBI(s).open();addTrack({kind:'signal',name:s.name,file:s.name,url:s.url,bbi:b});continue;}
      if(/\.maf(\.gz)?$/.test(n)){const aln=await loadTextMaf(s);addTrack({kind:'maf',name:s.name,file:s.name,url:s.url,aln});continue;}
      if(/\.(nwk|newick|tre|tree|nh|nhx|treefile|contree)$/.test(n)){setTree(TD.decode(await s.readAll()),s.name);continue;}
      if(/\.(gff3?|gtf)(\.gz)?$/.test(n)){const idx=await loadGff(s);addTrack({kind:'genes',name:s.name,file:s.name,url:s.url,idx});toast(`${s.name}: ${fmt(idx.count)} features`);continue;}
      if(/\.(wig)(\.gz)?$/.test(n)){const sig=await loadWig(s);addTrack({kind:'signal',name:s.name,file:s.name,url:s.url,sig});continue;}
      if(/\.2bit$/.test(n)){const fa=await new TwoBit(s).open();addTrack({kind:'seq',name:s.name,file:s.name,url:s.url,fa});continue;}
      if(/\.(fa|fasta|fna|fas)(\.gz)?$/.test(n)){const fai=byName.get(s.name+'.fai')||[...byName.values()].find(x=>x.name.toLowerCase()===n+'.fai');if(fai)used.add(fai.name);
        const fa=await loadFasta(s,fai);addTrack({kind:'seq',name:s.name,file:s.name,url:s.url,fa});continue;}
      if(/\.(bed|narrowpeak|broadpeak|gappedpeak|bedgraph|bdg|xls|txt|tsv|csv|peaks?)(\.gz)?$/.test(n)||true){
        const head=TD.decode((await s.read(0,4096)).subarray(0,4096));
        if(!Inflate.isGz(await s.read(0,2))&&/^\s*\(/.test(head)&&head.includes(';')){setTree(TD.decode(await s.readAll()),s.name);continue;}
        const r=await loadBedLike(s);
        if(r.kind==='signal')addTrack({kind:'signal',name:s.name,file:s.name,url:s.url,sig:r.sig});
        else{addTrack({kind:r.kind,name:s.name,file:s.name,url:s.url,idx:r.idx,bedKind:r.bedKind});toast(`${s.name}: ${fmt(r.idx.count)} ${r.kind==='genes'?'features':'peaks'}`);}continue;}
    }catch(e){console.error(e);errors.push(`${s.name}: ${e.message}`);}}
  {const mt=mafTrack();if(mt&&mt.focusFile&&!mt.focusTrack){const ft=S.tracks.find(t=>t.file===mt.focusFile);if(ft)mt.focusTrack=ft.id;}}
  refreshChroms();S.dataVersion=(S.dataVersion||0)+1;renderTracks();renderSpecies();invalidate();
  if(errors.length){toast(errors.join('\n'),8000);status(errors[0]);}else status('Loaded '+srcs.map(s=>s.name).join(', '));}

/* =====================================================================
   14. ALIGNMENT COLUMNS (for text export, wrapped figures and the viewer)
   ===================================================================== */
async function getAlignmentColumns(region,opt={}){const t=mafTrack();if(!t)throw new Error('No alignment loaded');
  const {chrom,start,end}=region;const ids=opt.ids||visibleRows().map(r=>r.id);const idSet=new Map(ids.map((id,i)=>[id,i]));
  const parts=ids.map(()=>[]);const posParts=[];let last=start;let refSeqFill=null;
  const fillTo=async(p)=>{if(p<=last)return;const n=p-last;let rs=null;
    if(opt.fillRef!==false){const sq=S.tracks.find(x=>x.kind==='seq');if(sq)rs=await sq.fa.seq(chrom,last,p);}
    const refI=idSet.get(S.refId);for(let i=0;i<ids.length;i++)parts[i].push(i===refI?(rs&&rs.length===n?rs:'N'.repeat(n)):'-'.repeat(n));
    const a=new Int32Array(n);for(let k=0;k<n;k++)a[k]=last+k;posParts.push(a);last=p;};
  const blocks=[];await t.aln.forEachBlock(chrom,start,end,b=>blocks.push(b),{noCache:end-start>S.style.maxAlnWindow,progress:opt.progress});
  blocks.sort((a,b)=>a.start-b.start);
  for(const b of blocks){const s0=Math.max(start,b.start),e0=Math.min(end,b.end);if(e0<=s0||e0<=last)continue;
    await fillTo(Math.max(last,Math.min(s0,end)));
    const ref=b.rows[b.refIdx].text;let pos=b.start,c0=-1,c1=ref.length;
    for(let c=0;c<ref.length;c++){if(ref[c]==='-'){if(pos>=last&&pos<e0&&c0<0&&opt.insertions!==false&&pos>last)c0=c;continue;}if(pos===last&&c0<0)c0=c;if(pos===e0){c1=c;break;}pos++;}
    if(c0<0){continue;}
    // trim leading insertion columns that belong before 'last'
    const rowsBy=new Map();b.rows.forEach(r=>{const g=Genomes.genomeOf(r.src);const id=rowIdForGenome(g);const i=idSet.get(id);if(i==null)return;(rowsBy.get(i)||rowsBy.set(i,[]).get(i)).push(r);});
    const cols=[];for(let c=c0;c<c1;c++){if(ref[c]==='-'&&opt.insertions===false)continue;cols.push(c);}
    const posArr=new Int32Array(cols.length);{let p=b.start;let ci=0;for(let c=0;c<c1&&ci<cols.length;c++){if(c===cols[ci]){posArr[ci++]=ref[c]==='-'?-1:p;}if(ref[c]!=='-')p++;}}
    posParts.push(posArr);
    for(let i=0;i<ids.length;i++){const rs=rowsBy.get(i);if(!rs){parts[i].push('-'.repeat(cols.length));continue;}
      const arr=new Array(cols.length);for(let k=0;k<cols.length;k++){let ch='-';for(const r of rs){const x=r.text[cols[k]];if(x!=='-'){ch=x;break;}}arr[k]=ch;}parts[i].push(arr.join(''));}
    last=e0;}
  await fillTo(end);
  let seqs=parts.map(p=>p.join(''));let total=0;for(const a of posParts)total+=a.length;const pos=new Int32Array(total);let o=0;for(const a of posParts){pos.set(a,o);o+=a.length;}
  let posOut=pos;
  if(opt.revcomp){const comp={A:'T',C:'G',G:'C',T:'A',a:'t',c:'g',g:'c',t:'a',N:'N',n:'n','-':'-'};seqs=seqs.map(s=>{let r='';for(let i=s.length-1;i>=0;i--)r+=comp[s[i]]??s[i];return r;});posOut=pos.slice().reverse();}
  return{ids,seqs,pos:posOut,region,revcomp:!!opt.revcomp};}
function alnToText(A,format){const names=A.ids.map(id=>{const r=S.rowById.get(id);return(r?r.label:id).replace(/\s+/g,'_');});const n=A.seqs.length;const L=A.seqs[0]?.length||0;
  const reg=`${A.region.chrom}:${A.region.start+1}-${A.region.end}${A.revcomp?' (reverse complement)':''}`;
  if(format==='fasta')return A.seqs.map((s,i)=>`>${names[i]} ${reg}\n`+s.replace(/(.{80})/g,'$1\n').replace(/\n$/,'')).join('\n')+'\n';
  if(format==='phylip')return`${n} ${L}\n`+A.seqs.map((s,i)=>`${names[i]}  ${s}`).join('\n')+'\n';
  if(format==='nexus')return`#NEXUS\n[${reg}]\nbegin data;\n  dimensions ntax=${n} nchar=${L};\n  format datatype=dna missing=? gap=-;\n  matrix\n`+A.seqs.map((s,i)=>`    ${names[i]}  ${s}`).join('\n')+'\n  ;\nend;\n';
  if(format==='clustal'){const w=Math.max(...names.map(x=>x.length))+2;let out=`CLUSTAL W multiple sequence alignment  ${reg}\n\n`;
    for(let o=0;o<L;o+=60){for(let i=0;i<n;i++)out+=names[i].padEnd(w)+A.seqs[i].slice(o,o+60)+'\n';let cons='';for(let k=o;k<Math.min(L,o+60);k++){const c=A.seqs[0][k].toUpperCase();cons+=(c!=='-'&&A.seqs.every(s=>s[k].toUpperCase()===c))?'*':' ';}out+=' '.repeat(w)+cons+'\n\n';}return out;}
  return'';}
async function mafRegionText(region){const t=mafTrack();const out=['##maf version=1 scoring=none',`# region ${region.chrom}:${region.start+1}-${region.end}`,''];
  const keep=new Set(visibleRows().map(r=>r.id));
  await t.aln.forEachBlock(region.chrom,region.start,region.end,b=>{const ref=b.rows[b.refIdx].text;let pos=b.start,c0=-1,c1=ref.length;
    for(let c=0;c<ref.length;c++){if(ref[c]!=='-'){if(pos===region.start)c0=c;if(pos===region.end){c1=c;break;}pos++;}}
    if(b.start>=region.start)c0=0;if(c0<0)return;out.push('a score=0');
    for(const r of b.rows){const id=rowIdForGenome(Genomes.genomeOf(r.src));if(!keep.has(id))continue;const pre=r.text.slice(0,c0).replace(/-/g,'').length;const seg=r.text.slice(c0,c1);const sz=seg.replace(/-/g,'').length;
      out.push(`s ${r.src} ${r.start+pre} ${sz} ${r.strand} ${r.srcSize} ${seg}`);}out.push('');},{noCache:true});return out.join('\n');}

/* ---- wrapped base-level alignment figure ---- */
function wrappedLayout(A,o){const st=S.style;const fs=o.fontSize;const cellW=o.cellW,rowH=o.rowH;const labels=A.ids.map(id=>{const r=S.rowById.get(id);return r?displayLabel(r):id;});
  const lw=Math.ceil(Math.max(...labels.map(l=>textW(l,fs,st.italicSpecies,false))))+14;const L=A.seqs[0]?.length||0;const per=o.perLine;const nLines=Math.ceil(L/per);
  const blockH=(A.ids.length+(o.consensus?1:0)+1)*rowH+o.lineGap;const W=Math.ceil(12+lw+per*cellW+60);return{labels,lw,L,per,nLines,blockH,W,H:Math.ceil(12+nLines*blockH+st.fontSize),cellW,rowH,fs};}
function wrappedOps(A,lay,o,lineFrom,lineTo,yOff=0){const st=S.style;const ops=[];const {labels,lw,per,blockH,cellW,rowH,fs,L}=lay;const x0=12+lw;const refI=A.ids.indexOf(S.refId);
  for(let li=lineFrom;li<lineTo;li++){const c0=li*per,c1=Math.min(L,c0+per);let y=12+li*blockH-yOff;
    // position header
    let firstPos=-1,lastPos=-1;for(let c=c0;c<c1;c++)if(A.pos[c]>=0){if(firstPos<0)firstPos=A.pos[c];lastPos=A.pos[c];}
    ops.push({t:'text',x:x0,y:y+rowH/2,s:firstPos>=0?fmt(firstPos+1):'',size:fs-1.5,fill:'#555'});
    if(lastPos>=0)ops.push({t:'text',x:x0+(c1-c0)*cellW,y:y+rowH/2,s:fmt(lastPos+1),size:fs-1.5,fill:'#555',anchor:'end'});
    y+=rowH;
    A.seqs.forEach((s,i)=>{const yc=y+i*rowH+rowH/2;ops.push({t:'text',x:12,y:yc,s:labels[i],size:fs,fill:TS('species').fill,italic:st.italicSpecies,bold:i===refI&&st.boldRef});
      let run=null,rx=0;const flush=x=>{if(run)ops.push({t:'rect',x:rx,y:y+i*rowH+0.5,w:x-rx,h:rowH-1,fill:run});run=null;};
      const chars=[];let tcol=null,tstart=0;const tflush=()=>{if(chars.length)ops.push({t:'chars',x0:x0+tstart*cellW,dx:cellW,y:yc,s:chars.join(''),size:fs,fill:tcol});chars.length=0;};
      for(let c=c0;c<c1;c++){const ch=s[c];const code=ch.charCodeAt(0);const refc=refI>=0?A.seqs[refI][c]:null;const same=refc&&i!==refI&&ch!=='-'&&ch.toUpperCase()===refc.toUpperCase();
        let bg=null;if(o.colorBoxes&&ch!=='-'&&ch!=='N'&&ch!=='n'){bg=(o.colorMode==='mismatch'&&same)?null:charColor(code);if(o.colorMode==='mismatch'&&i===refI)bg=null;}
        if(bg!==run){flush(x0+(c-c0)*cellW);if(bg){run=bg;rx=x0+(c-c0)*cellW;}}
        let shown=(o.dots&&same)?'.':ch;const fcol=bg?(lum(bg)>0.6?'#111':'#fff'):(ch==='-'?'#999':'#222');
        if(fcol!==tcol){tflush();tcol=fcol;tstart=c-c0;}chars.push(shown);}
      flush(x0+(c1-c0)*cellW);tflush();});
    if(o.consensus){const yc=y+A.seqs.length*rowH+rowH/2;let s='';for(let c=c0;c<c1;c++){const r=(A.seqs[refI>=0?refI:0][c]||'-').toUpperCase();s+=(r!=='-'&&A.seqs.every(q=>q[c].toUpperCase()===r))?'*':' ';}
      ops.push({t:'chars',x0,dx:cellW,y:yc,s,size:fs,fill:'#333'});}}
  return ops;}

function download(name,data,type){const blob=data instanceof Blob?data:new Blob([data],{type:type||'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();

  S.rows=(s.rows||[]).map(r=>({...r,extra:false}));S.rowById=new Map(S.rows.map(r=>[r.id,r]));syncRowsWithTree();Genomes.reset();

async function regionsOnChrom(ft,chrom){if(ft.idx){if(ft.idx.dirty)ft.idx.finish();const c=resolveChrom(chrom,ft.idx.keys);return c!=null?ft.idx.by.get(c):[];}

async function allRegions(ft){if(ft.idx)return ft.idx.all().slice().sort((a,b)=>a.chrom<b.chrom?-1:a.chrom>b.chrom?1:a.start-b.start);
  const out=[];for(const c of ft.bbi.chroms){const r=await trackIntervals(ft,c.name,0,c.len);out.push(...r);}return out;}
function sanitize(s){return String(s).replace(/[^\w.-]+/g,'_');}
async function peakStats(mt,peaks,onProgress,cancel){const tw=(mt.consWeight||'tree')==='tree'?treeWeights():null;const out=[];
  for(let i=0;i<peaks.length;i++){if(cancel.stop)break;const f=peaks[i];const L=Math.max(1,f.end-f.start);
    const d=await computeMafBins(mt,f.chrom,f.start,f.end,1);const others=visibleRows().filter(r=>r.id!==d.refId&&r.id!==S.refId);
    let ws=0,wm=0,wc=0,n50=0;for(const r of others){const a=d.sp.get(r.id);const w=tw&&tw.has(r.id)?Math.max(1e-6,tw.get(r.id)):1;ws+=w;const cov=a?a.cov[0]:0,match=a?a.match[0]:0;wm+=w*match;wc+=w*cov;if(cov/L>=0.5)n50++;}
    out.push({i:i+1,f,name:f.name||`region_${i+1}`,chrom:f.chrom,start:f.start,end:f.end,len:L,signal:isFinite(f.signal)?f.signal:(f.score||null),

    <div style="overflow:auto;max-height:58vh;background:#fff;border:1px solid var(--line);border-radius:4px"><canvas id="gCv" style="display:block"></canvas></div>`);
  const el=m.el,q=x=>el.querySelector(x);let sc=null;
  const opts=()=>({panelW:Math.max(80,+q('#gW').value||260),perRow:Math.max(1,+q('#gR').value||4),pad:Math.max(0,+q('#gP').value||0),shared:q('#gS').checked});
  const preview=async()=>{q('#gMsg').textContent='Drawing…';try{sc=await buildGallery(regions,opts());const c=q('#gCv');const dpr=devicePixelRatio||1;c.width=sc.width*dpr;c.height=sc.height*dpr;c.style.width=sc.width+'px';c.style.height=sc.height+'px';
    const ctx=c.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);paint(ctx,sc.ops);q('#gMsg').textContent=`${sc.width} × ${sc.height} px layout`;}catch(e){console.error(e);q('#gMsg').textContent='Error: '+e.message;}};
  q('#gPrev').onclick=preview;
  q('#gSave').onclick=async()=>{if(!sc)await preview();const f=q('#gF').value;const name=`peaks_figure_${regions.length}`;
    if(f==='svg')download(name+'.svg',sceneToSVG(sc),'image/svg+xml');else{o_dpi=+q('#gD').value;download(name+(f==='png'?'.png':'.jpg'),await rasterize(sc,o_dpi/96,f==='png'?'image/png':'image/jpeg'));}};
  preview();}

function renderEmpty(){$('empty').innerHTML=`<h2>Load a Cactus alignment to begin</h2>
  <p>Everything runs inside this browser tab. Files are read straight from your disk, so multi-gigabyte bigMaf and bigWig files open instantly and nothing is uploaded.</p>
  <ol><li>Drop your <code>.bb</code> bigMaf (or <code>.maf</code>) and the species tree <code>.nwk</code> anywhere on this page.</li>
  <li>Add ATAC tracks: <code>.bw</code> signal, <code>.narrowPeak</code>/<code>.broadPeak</code>/<code>.bed</code> peaks; and your <code>.gff3</code>/<code>.gtf</code> annotation and genome <code>.fa</code>+<code>.fai</code>.</li>
  <li>Type a gene name or <code>chrom:start..end</code> above, drag to pan, <span class="kbd">Shift</span>-drag to select a region.</li>
  <li><b>Export…</b> saves SVG / PNG / JPEG at any DPI, base-level alignment figures, and FASTA/Clustal/PHYLIP/NEXUS/MAF for any region length.</li></ol>
  <div class="row" style="justify-content:flex-start;margin-top:14px"><button class="btn primary" id="emOpen">Open files…</button><button class="btn" id="emDemo">Try the demo data</button></div>`;
  $('emOpen').onclick=()=>$('fileInput').click();$('emDemo').onclick=loadDemo;}
function help(){modal('How to use',`<div style="max-width:760px;line-height:1.6">
  <h3>Loading</h3><p>Drag files onto the page or use <b>Open files…</b>. Supported: bigMaf <code>.bb</code>, MAF <code>.maf/.maf.gz</code>, Newick trees, bigWig <code>.bw</code>, bigBed peaks, <code>narrowPeak broadPeak gappedPeak bed bedGraph wig</code>, MACS2 <code>_peaks.xls</code>, <code>gff3 gtf</code> (also <code>.gz</code>), FASTA with <code>.fai</code> (select both together), plain FASTA, and <code>.2bit</code>. Tree leaf names must match genome names in the MAF; unmatched genomes can be paired with leaves in <b>Species &amp; tree</b>.</p>
  <h3>Navigating</h3><p>Drag to pan · double-click to zoom in · <span class="kbd">Ctrl</span>/<span class="kbd">⌘</span>+scroll or pinch to zoom · horizontal scroll pans · <span class="kbd">←</span> <span class="kbd">→</span> pan · <span class="kbd">+</span> <span class="kbd">−</span> zoom. Type a gene name in the location box.</p>
  <h3>Selecting and editing</h3><p><span class="kbd">Shift</span>-drag in the view (or drag on the ruler) to select a region: zoom to it, view its bases, export it, highlight it, or create an annotation. Click a tree node to rotate it or colour a clade; click a species name to rename it; click a gene or peak to edit or delete it; click a track name to open its settings. Edited annotations export as GFF3/BED.</p>
  <h3>Publication figures</h3><p><b>Export…</b> renders the figure again at the size you choose, so text stays sharp. SVG keeps every element (tree, labels, tracks) as editable vectors grouped by track for Illustrator or Inkscape. PNG/JPEG carry the DPI you set. For base-by-base figures use the base-level export; for any length of sequence use FASTA, Clustal, PHYLIP, NEXUS or MAF export.</p>
  <h3>Reading the alignment</h3><p>Each row is one species aligned to the reference (bold). In <i>Identity</i> mode darker colour means higher identity; thin grey lines are deletions in that species; pink ticks mark insertions relative to the reference; empty space means no alignment. Zoom in until letters appear to read the bases.</p></div>`);}
$('btnOpen').onclick=()=>$('fileInput').click();$('btnExport').onclick=()=>openExport();$('btnAln').onclick=()=>openAlignmentViewer();$('btnHelp').onclick=help;
if(/^https?:$/.test(location.protocol)){$('btnGetApp').hidden=false;$('btnGetApp').onclick=async()=>{try{const r=await fetch(location.href.split('#')[0],{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);
  download('CactusAlignmentViewer.html',await r.text(),'text/html');toast('Saved CactusAlignmentViewer.html — double-click it to run the viewer offline.',7000);}catch(e){toast('Could not download: '+e.message);}};}
$('btnGo').onclick=goLocus;$('locus').onkeydown=e=>{if(e.key==='Enter')goLocus();};
$('chromSel').onchange=e=>{const c=e.target.value;setView(c,0,Math.min(100000,chromLen(c)));};
$('btnLeft').onclick=()=>pan(-0.4);$('btnRight').onclick=()=>pan(0.4);$('btnIn').onclick=()=>zoom(0.5);$('btnOut').onclick=()=>zoom(2);
$('btnAddText').onclick=()=>addText();$('btnAddBox').onclick=startDrawBox;$('btnAll').onclick=()=>zoomToWidth('all');$('zoomPreset').onchange=e=>{const v=e.target.value;e.target.value='';if(v)zoomToWidth(v==='all'?'all':+v);};
$('btnBack').onclick=()=>histGo(-1);$('btnFwd').onclick=()=>histGo(1);
$('btnSaveView').onclick=e=>{if(!S.tracks.length){toast('Load some data first');return;}const r=e.target.getBoundingClientRect();
  const quick=async(fmtv,dpi)=>{const reg={...S.view};const W=scene?scene.width:sheetWidth();status('Saving…',true);
    try{const probe=buildScene({},{width:W,region:reg,export:true});const scale=fmtv==='svg'?1.5:dpi/96;const D=await prepareData(reg,Math.max(10,Math.round(probe.dataW*scale)),{});
      const sc=buildScene(D,{width:W,region:reg,export:true});const base=`view_${safeName(reg)}`;
      if(fmtv==='svg')download(base+'.svg',sceneToSVG(sc),'image/svg+xml');else{o_dpi=dpi;download(base+(fmtv==='png'?'.png':'.jpg'),await rasterize(sc,dpi/96,fmtv==='png'?'image/png':'image/jpeg'));}}
    catch(err){toast(err.message,6000);}status('Ready');};
  menu(r.left,r.bottom+4,'Current view, as shown',[['SVG (vector)',()=>quick('svg')],['PNG · 300 DPI',()=>quick('png',300)],['PNG · 600 DPI',()=>quick('png',600)],['JPEG · 300 DPI',()=>quick('jpeg',300)],'-',['More options (size, region, sequences)…',()=>openExport(S.view)]]);};
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select')||document.querySelector('.modal-bg'))return;if((e.metaKey||e.ctrlKey)&&e.key==='z'){e.preventDefault();histGo(e.shiftKey?1:-1);}});
$('sideToggle').onclick=()=>document.body.classList.toggle('side-open');
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select')||document.querySelector('.modal-bg'))return;
  if(e.key==='ArrowLeft')pan(-0.2);else if(e.key==='ArrowRight')pan(0.2);else if(e.key==='+'||e.key==='=')zoom(0.5);else if(e.key==='-'||e.key==='_')zoom(2);else if(e.key==='Escape'){S.selection=null;selBox=null;if(drawBoxMode){drawBoxMode=false;cv.classList.remove('drawing');status('Ready');}closePop();requestRender();}
  else if((e.key==='Delete'||e.key==='Backspace')&&selBox){const i=S.boxes.findIndex(b=>b.id===selBox);if(i>=0){S.boxes.splice(i,1);selBox=null;closePop();renderTracks();requestRender();}}});
new ResizeObserver(()=>{if(S.tracks.length)requestRender();}).observe($('stage'));
renderEmpty();renderTracks();renderSpecies();renderStyle();render();
</script>
